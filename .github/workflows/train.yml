name: Train and validate
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'
jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - run: python train.py data/example.csv model.joblib
      - run: python drift.py model.joblib data/example.csv
      - uses: actions/upload-artifact@v4
        with: {name: trained-model, path: model.joblib}
